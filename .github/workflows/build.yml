name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job below can write.
permissions:
  contents: read

jobs:
  build:
    # Intel runner: TurboFan and its kext are x86_64 only.
    runs-on: macos-15-intel
    env:
      # Pull request builds are test (alpha) builds and show their PR number in the app.
      TF_CHANNEL: ${{ github.event_name == 'pull_request' && 'alpha' || 'release' }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Build Free (app, CLI, helper, kext) and package
        run: ./scripts/package.sh
      - name: Build Pro
        run: ./scripts/build-pro.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TurboFan
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TurboFan
          path: dist
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          files: |
            dist/*.zip
            dist/*.sha256
